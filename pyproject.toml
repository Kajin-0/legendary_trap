[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legendary-trap"
version = "0.1.0"
description = "Local-first authoritative-lyrics audio alignment pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "faster-whisper>=1.1,<2",
  "librosa>=0.10",
  "numpy>=2.0",
  "rapidfuzz>=3.9",
  "scipy>=1.12",
  "soundfile>=0.12",
  "Pillow>=12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
